<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box sizing - forms</title>
    <style>
        div{
            border: 1px dashed rgb(33, 116, 167);
            width: 30rem;
            margin: 5rem auto;
            min-height: 30rem;
            margin-top: 50rem;
            padding: 5rem;
            box-sizing: border-box;
            /* 
            o atributo box-sizing é responsável por manter a largura do elemento
            igual a largura definida, quando o padding é delimitado,
            visto que ao alterar o padding a largura é alterada, geralmente
            (sem box-sizing)

            quando se define o padding e width, a largura da marcação é alterada,
            isto é, se eu defini 20rem de largura e 4rem de padding, a largura
            final fica 28rem (4rem 20rem 4rem), ao definir o box-sizing, a 
            largura se mantém 20rem e o padding é definido para dentro da
            marcação.
            */
        }
    </style>
</head>
<body>
    <div>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Eveniet dolorem sapiente ab incidunt quo autem minima assumenda, quam architecto laboriosam fuga ex, ipsum illum quasi libero nobis doloremque exercitationem corrupti?</p>
    </div>
</body>
</html>

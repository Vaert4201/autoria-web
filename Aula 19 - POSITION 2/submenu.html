<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body > ol{
            /* seleciona o ol imediatamente dentro do body */
            display: flex;
        }
        li{
            list-style-type: none;
            margin-right: 2rem;
            position: relative;
            cursor: pointer;
        }
        ol ol {
            background-color: aquamarine;
            padding: 2rem;
            visibility: hidden;
        }
        li:hover ol{
            visibility: visible;
        }
    </style>
</head>
<body>
    <ol>
        <li>Página Inicial</li>
        <li>Programação
            <ol>
                <li>Palestras</li>
                <li>Minicursos</li>
            </ol>
        </li> <!-- O LI FECHA DEPOIS DA LISTA INTERNA-->
        <li>Organização</li>
        <li>Exposição
            <ol>
                <li>Tecnologia</li>
                <li>Empreendedorismo</li>
                <li>Projetos</li>
            </ol>
        </li>
        <li>Contato</li>
    </ol>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISPLAY FLEX</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            /* DIAGRAMAÇÃO */
            /* 
            - para usar o display flex é necessário aplicar no
            container!!
            - ao aplicar o display flex no container,
            todas as marcações ficarão (por padrão) 
            uma ao lado da outra
            - similar ao display: 'inline-block', as marcações
            ficarão uma ao lado da outra, só que no 'display: flex'
            teremos MUITO MAIS configurações
            */
        }
        div {
            border: 1px solid black; 
            width: 20rem; /* largura */
            margin: 2rem; /* espaçamento externo */
            padding: 2rem; /* espaçamento interno */
        }
    </style>
</head>
<body>
    <div><p>Renan Cobogó</p></div>
    <div><p>Arthur Pacotinho</p></div>
    <div><p>LG TV</p></div>
    <div><p>Who's He</p></div>
    <div><p>Heytor Japão</p></div>
</body>
</html>
